name: CI

on:
  push:
    branches: [main, master, dev]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Test
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build pipe image
        run: docker build -t dmarc-analyzer .

  viewer:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build viewer
        run: make viewer
      - name: Check binary
        run: |
          test -x dist/dmarc-viewer
          file dist/dmarc-viewer
          cp dist/dmarc-viewer dist/dmarc-viewer-linux-x86_64
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmarc-viewer-linux-x86_64
          path: dist/dmarc-viewer-linux-x86_64
          if-no-files-found: error
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/dmarc-viewer-linux-x86_64 --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/dmarc-viewer-linux-x86_64 --title "$GITHUB_REF_NAME" --generate-notes
          fi
